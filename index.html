<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hệ Thống Quản Lý Kho - Issue MTI</title>

    <style>
        :root {
            --bg-main: #0b1120;
            --bg-card: #111827;
            --bg-input: #1f2937;
            --border-color: #374151;
            --text-cyan: #00f2fe;
            --text-gray: #9ca3af;
            --text-white: #ffffff;
            --btn-green: #10b981;
            --btn-green-hover: #059669;
            --btn-danger: #ef4444;
            --btn-danger-hover: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            padding: 12px;
            height: 100vh;
            font-size: 13px;
            overflow: hidden;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 400px 1fr;
            grid-template-rows: auto 1fr;
            gap: 12px;
            height: calc(100vh - 24px);
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 0;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: var(--text-cyan);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .4px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-gray);
            font-size: 11px;
        }

        .form-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 70px;
            gap: 10px;
            margin-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }

        label {
            font-size: 11px;
            color: var(--text-gray);
            font-weight: 600;
            text-transform: uppercase;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        select {
            width: 100%;
            height: 38px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-white);
            padding: 0 10px;
            border-radius: 5px;
            outline: none;
            font-size: 12px;
        }

        input:focus,
        select:focus {
            border-color: var(--text-cyan);
            box-shadow: 0 0 5px rgba(0, 242, 254, .3);
        }

        .radio-group {
            display: flex;
            height: 38px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 0 10px;
            gap: 15px;
            align-items: center;
            justify-content: space-around;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .radio-item.good {
            color: #38bdf8;
        }

        .radio-item.damage {
            color: #f87171;
        }

        .radio-item.wrong {
            color: #fbbf24;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 4px;
        }

        .btn-action {
            height: 38px;
            border: none;
            border-radius: 5px;
            font-weight: 700;
            cursor: pointer;
            font-size: 12px;
            text-transform: uppercase;
            transition: opacity .2s;
        }

        .btn-action:hover {
            opacity: .9;
        }

        .btn-action:disabled {
            opacity: .6;
            cursor: wait;
        }

        .btn-query {
            background: #00d2ff;
            color: #000;
        }

        .btn-done {
            background: var(--btn-green);
            color: #fff;
        }

        .btn-reload {
            background: #1f2937;
            color: #fff;
            border: 1px solid #374151;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .btn-reload:hover {
            background: #374151;
        }

        .placeholder-box {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-gray);
            font-size: 12px;
            border: 1px dashed #1f2937;
            border-radius: 5px;
        }

        .table-container {
            flex: 1;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 12px;
        }

        th {
            background: #1f2937;
            color: var(--text-gray);
            font-size: 11px;
            font-weight: 600;
            padding: 10px;
            border-bottom: 1px solid #374151;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        td {
            padding: 9px 10px;
            border-bottom: 1px solid #1f2937;
            color: #d1d5db;
        }

        .btn-delete {
            background: var(--btn-danger);
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
        }

        .btn-delete:hover {
            background: var(--btn-danger-hover);
        }

        @media (max-width: 900px) {
            body {
                height: auto;
                overflow: auto;
            }

            .dashboard {
                display: flex;
                flex-direction: column;
                height: auto;
            }

            .card {
                min-height: 300px;
            }
        }
    </style>
</head>

<body>

<div class="dashboard">

    <!-- KHUNG 1: NHẬP DỮ LIỆU -->
    <div class="card">
        <div class="card-header">
            1. NHẬP DỮ LIỆU - ISSUE MTI
        </div>

        <div class="form-row-2">
            <div class="form-group">
                <label>Inbound Date</label>
                <input type="date" id="inboundDate">
            </div>

            <div class="form-group">
                <label>Warehouse</label>
                <select id="warehouse">
                    <option value="VNA">VNA</option>
                    <option value="VNNL">VNNL</option>
                    <option value="VNVL">VNVL</option>
                </select>
            </div>
        </div>

        <div class="form-row-2">
            <div class="form-group">
                <label>Staff</label>
                <input type="text" id="staff" placeholder="Nhập tên">
            </div>

            <div class="form-group">
                <label>Shipping ID</label>
                <input type="text" id="shippingId" placeholder="Nhập Shipping ID">
            </div>
        </div>

        <div class="form-row-3">
            <div class="form-group">
                <label>MTB</label>
                <input type="text" id="inputMtb" placeholder="Bắn/Nhập MTB">
            </div>

            <div class="form-group">
                <label>Input SKU ID</label>
                <input type="text" id="inputSku" placeholder="Bắn/Nhập SKU">
            </div>

            <div class="form-group">
                <label>Qty</label>
                <input type="number" id="inputQty" value="1" min="1">
            </div>
        </div>

        <div class="form-group" style="margin-bottom:10px;">
            <label>Condition</label>

            <div class="radio-group">
                <label class="radio-item good">
                    <input type="radio" name="condition" value="GOOD" checked>
                    GOOD
                </label>

                <label class="radio-item damage">
                    <input type="radio" name="condition" value="DAMAGE">
                    DAMAGE
                </label>

                <label class="radio-item wrong">
                    <input type="radio" name="condition" value="SAI HÀNG">
                    SAI HÀNG
                </label>
            </div>
        </div>

        <div class="form-group" id="correctSkuBox"
             style="display:none;margin-bottom:10px;">
            <label style="color:#fbbf24;">SKU ĐÚNG</label>
            <input type="text" id="correctSku" placeholder="Nhập SKU đúng">
        </div>

        <div class="btn-grid">
            <button class="btn-action btn-query" id="btnAdd">
                QUERY / ENTER
            </button>

            <button class="btn-action btn-done" id="btnSave">
                DONE / LƯU SHEET
            </button>
        </div>
    </div>


    <!-- KHUNG 3: INVENTORY DETAILS -->
    <div class="card">
        <div class="card-header">
            <span>3. INVENTORY DETAILS</span>

            <div class="header-right">
                <span id="locCount">0 LOCATIONS</span>

                <button class="btn-reload" id="btnResetInventory">
                    ↻ TẢI LẠI
                </button>
            </div>
        </div>

        <div class="placeholder-box" id="inventoryBox">
            Scan SKU và nhấn ENTER để tra cứu
        </div>
    </div>


    <!-- KHUNG 2: SKU VỪA BẮN -->
    <div class="card">
        <div class="card-header">
            2. THÔNG TIN SKU VỪA BẮN
        </div>

        <div class="placeholder-box" id="recentSkuBox">
            Chưa có thông tin SKU
        </div>
    </div>


    <!-- KHUNG 4: QUEUE -->
    <div class="card">
        <div class="card-header">
            <span>4. QUEUE - DANH SÁCH ĐÃ BẮN</span>

            <div class="header-right">
                <span id="queueCount">0 SKU</span>

                <button class="btn-reload"
                        id="btnClear"
                        style="background:#ef4444;border-color:#dc2626;">
                    ✕ XÓA TẤT CẢ
                </button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>MTB</th>
                        <th>SKU ID</th>
                        <th>Condition</th>
                        <th>Warehouse / Staff / Shipping ID</th>
                        <th>SKU Đúng</th>
                        <th>Qty</th>
                        <th style="width:50px;text-align:center;">Xóa</th>
                    </tr>
                </thead>

                <tbody id="queueTableBody">
                    <tr>
                        <td colspan="7"
                            style="text-align:center;color:#9ca3af;padding:30px;">
                            Chưa có SKU trong queue
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>


<!-- Không được xóa hai thẻ script này -->
<script>
    // URL Web App Apps Script mới
    const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbz0tFaUKek27z-xs2zjF3ZTAJzv9HOiaGZsA8d4h33P9Uu3YEl-3C92x73ykh5M73le/exec";

    let queue = [];

    const inboundDate = document.getElementById("inboundDate");
    const warehouse = document.getElementById("warehouse");
    const staff = document.getElementById("staff");
    const shippingId = document.getElementById("shippingId");
    const inputMtb = document.getElementById("inputMtb");
    const inputSku = document.getElementById("inputSku");
    const inputQty = document.getElementById("inputQty");
    const correctSku = document.getElementById("correctSku");
    const correctSkuBox = document.getElementById("correctSkuBox");
    const recentSkuBox = document.getElementById("recentSkuBox");
    const queueTableBody = document.getElementById("queueTableBody");
    const queueCount = document.getElementById("queueCount");
    const btnSave = document.getElementById("btnSave");


    // Gán ngày hiện tại
    function setToday() {
        const now = new Date();

        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");

        inboundDate.value = `${year}-${month}-${day}`;
    }


    // Hiển thị ô SKU đúng
    document.querySelectorAll('input[name="condition"]')
        .forEach(function(radio) {
            radio.addEventListener("change", function() {
                correctSkuBox.style.display =
                    this.value === "SAI HÀNG" ? "block" : "none";
            });
        });


    // Enter tại MTB
    inputMtb.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            e.preventDefault();
            inputSku.focus();
            inputSku.select();
        }
    });


    // Enter tại SKU
    inputSku.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            e.preventDefault();
            inputQty.focus();
            inputQty.select();
        }
    });


    // Enter tại số lượng
    inputQty.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            e.preventDefault();

            const condition = document.querySelector(
                'input[name="condition"]:checked'
            ).value;

            if (condition === "SAI HÀNG") {
                correctSku.focus();
                correctSku.select();
            } else {
                addToQueue();
            }
        }
    });


    // Enter tại SKU đúng
    correctSku.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            e.preventDefault();
            addToQueue();
        }
    });


    // Nút thêm vào queue
    document.getElementById("btnAdd")
        .addEventListener("click", addToQueue);


    // Thêm dữ liệu vào queue
    function addToQueue() {
        const mtbValue = inputMtb.value.trim();
        const skuValue = inputSku.value.trim();
        const qtyValue = parseInt(inputQty.value, 10) || 0;
        const staffValue = staff.value.trim();
        const shippingIdValue = shippingId.value.trim();

        const conditionValue = document.querySelector(
            'input[name="condition"]:checked'
        ).value;

        const correctSkuValue = correctSku.value.trim();

        if (!skuValue) {
            alert("Vui lòng nhập hoặc bắn SKU!");
            inputSku.focus();
            return;
        }

        if (qtyValue <= 0) {
            alert("Số lượng phải lớn hơn 0!");
            inputQty.focus();
            return;
        }

        if (conditionValue === "SAI HÀNG" && !correctSkuValue) {
            alert("Vui lòng nhập SKU đúng!");
            correctSku.focus();
            return;
        }

        const item = {
            date: inboundDate.value,
            warehouse: warehouse.value,
            shippingId: shippingIdValue || "N/A",
            mtb: mtbValue,
            sku: skuValue,

            // Không sử dụng cột F khi Apps Script ghi dữ liệu
            skuName: "",

            qty: qtyValue,
            note: conditionValue,
            pallet: "",
            staff: staffValue || "N/A",
            time: new Date().toLocaleTimeString("vi-VN"),
            correctSku: conditionValue === "SAI HÀNG"
                ? correctSkuValue
                : ""
        };

        queue.push(item);

        recentSkuBox.innerHTML = `
            <div style="text-align:left;width:100%;padding:10px;">
                <p>
                    <b>MTB:</b>
                    <span style="color:#fbbf24;">
                        ${escapeHtml(item.mtb || "-")}
                    </span>
                </p>

                <p>
                    <b>SKU:</b>
                    <span style="color:#00f2fe;">
                        ${escapeHtml(item.sku)}
                    </span>
                </p>

                <p><b>QTY:</b> ${item.qty}</p>
                <p><b>Condition:</b> ${escapeHtml(item.note)}</p>

                <p>
                    <b>Staff/Shipping:</b>
                    ${escapeHtml(item.staff)}
                    /
                    ${escapeHtml(item.shippingId)}
                </p>
            </div>
        `;

        renderQueue();

        inputMtb.value = "";
        inputSku.value = "";
        inputQty.value = 1;
        correctSku.value = "";

        inputMtb.focus();
    }


    // Hiển thị queue
    function renderQueue() {
        queueCount.textContent = queue.length + " SKU";

        if (queue.length === 0) {
            queueTableBody.innerHTML = `
                <tr>
                    <td colspan="7"
                        style="text-align:center;color:#9ca3af;padding:30px;">
                        Chưa có SKU trong queue
                    </td>
                </tr>
            `;
            return;
        }

        queueTableBody.innerHTML = queue.map(function(item, index) {
            return `
                <tr>
                    <td>${escapeHtml(item.mtb || "-")}</td>
                    <td>${escapeHtml(item.sku)}</td>
                    <td>${escapeHtml(item.note)}</td>
                    <td>
                        ${escapeHtml(item.warehouse)}
                        /
                        ${escapeHtml(item.staff)}
                        /
                        ${escapeHtml(item.shippingId)}
                    </td>
                    <td>${escapeHtml(item.correctSku || "-")}</td>
                    <td>${item.qty}</td>
                    <td style="text-align:center;">
                        <button class="btn-delete"
                                onclick="removeItem(${index})">
                            Xóa
                        </button>
                    </td>
                </tr>
            `;
        }).join("");
    }


    // Xóa một dòng
    function removeItem(index) {
        queue.splice(index, 1);
        renderQueue();
    }

    window.removeItem = removeItem;


    // Xóa toàn bộ queue
    document.getElementById("btnClear")
        .addEventListener("click", function() {
            if (queue.length === 0) {
                return;
            }

            if (confirm("Xóa tất cả dữ liệu tạm?")) {
                queue = [];
                renderQueue();

                recentSkuBox.innerHTML = "Chưa có thông tin SKU";
                inputMtb.focus();
            }
        });


    // Tải lại inventory
    document.getElementById("btnResetInventory")
        .addEventListener("click", function() {
            document.getElementById("inventoryBox").innerHTML =
                "Scan SKU và nhấn ENTER để tra cứu";

            document.getElementById("locCount").textContent =
                "0 LOCATIONS";
        });


    // Lưu dữ liệu về Google Sheet
    btnSave.addEventListener("click", saveToSheet);

    async function saveToSheet() {
        if (queue.length === 0) {
            alert("Queue đang trống!");
            return;
        }

        const oldText = btnSave.textContent;

        // Tạo bản sao để tránh queue bị thay đổi trong lúc gửi
        const dataToSave = JSON.parse(JSON.stringify(queue));

        btnSave.disabled = true;
        btnSave.textContent = "ĐANG LƯU...";

        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify({
                    items: dataToSave
                })
            });

            alert(
                "Đã gửi " + dataToSave.length +
                " SKU về Google Sheet."
            );

            queue = [];
            renderQueue();

            recentSkuBox.innerHTML = "Chưa có thông tin SKU";
            inputMtb.focus();

        } catch (error) {
            console.error("Lỗi lưu dữ liệu:", error);
            alert("Không thể gửi dữ liệu về Google Sheet.");
        } finally {
            btnSave.disabled = false;
            btnSave.textContent = oldText;
        }
    }


    // Bảo vệ nội dung khi đưa vào HTML
    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    setToday();
    renderQueue();
    inputMtb.focus();
</script>

</body>
</html>
